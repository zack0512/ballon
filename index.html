<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>繽紛節慶戳氣球大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'festive-pink': '#FF6B6B',
                        'festive-purple': '#845EC2',
                        'festive-yellow': '#FFC75F',
                        'festive-teal': '#4D96FF',
                        'festive-green': '#6BCB77',
                    },
                    fontFamily: {
                        'fredoka': ['"Fredoka One"', 'cursive', 'sans-serif'],
                        'noto': ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background: linear-gradient(135deg, #fef3c7 0%, #f3e8ff 50%, #e0f2fe 100%);
        }
        
        .party-font {
            font-family: 'Fredoka One', cursive;
        }

        .btn-shadow {
            box-shadow: 0 6px 0 rgba(0,0,0,0.12);
            transition: all 0.1s ease;
        }
        .btn-shadow:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.12);
        }

        .pop-text {
            pointer-events: none;
            animation: floatUpAndFade 0.8s ease-out forwards;
        }

        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-30px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-60px) scale(1); }
        }

        .bounce-anim {
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="h-screen w-screen relative flex flex-col justify-between items-center select-none overflow-hidden">

    <header class="w-full max-w-4xl px-4 pt-3 pb-1 flex justify-between items-center z-20">
        <!-- Score & High Score -->
        <div class="flex items-center gap-2 sm:gap-4">
            <div class="bg-white/90 backdrop-blur border-2 border-purple-300 rounded-2xl px-4 py-1.5 shadow-md flex items-center gap-2">
                <span class="text-xs sm:text-sm font-bold text-gray-500">得分</span>
                <span id="score-display" class="party-font text-2xl sm:text-3xl text-purple-600">0</span>
            </div>
            <div class="bg-white/70 backdrop-blur rounded-xl px-3 py-1 shadow-sm hidden sm:flex items-center gap-1.5">
                <span class="text-xs font-bold text-gray-400">最高分</span>
                <span id="high-score-display" class="party-font text-lg text-gray-600">0</span>
            </div>
        </div>

        <!-- Combo & Timer -->
        <div class="flex items-center gap-2">
            <div id="combo-container" class="opacity-0 transition-opacity duration-200 bg-gradient-to-r from-amber-400 to-pink-500 text-white font-bold rounded-2xl px-3 py-1 shadow-lg text-center transform rotate-[-3deg]">
                <span id="combo-count" class="party-font text-xl">2x</span>
                <span class="text-xs block leading-3 font-black">連擊!</span>
            </div>
            <div class="bg-white/90 backdrop-blur border-2 border-rose-300 rounded-2xl px-4 py-1.5 shadow-md flex items-center gap-2">
                <span class="text-xs sm:text-sm font-bold text-gray-500">倒數</span>
                <span id="timer-display" class="party-font text-2xl sm:text-3xl text-rose-500">30</span>
            </div>
        </div>
    </header>

    <main class="relative w-full flex-1 max-w-5xl my-2 rounded-3xl overflow-hidden shadow-inner border-4 border-white/80 bg-gradient-to-b from-sky-50/40 via-purple-50/30 to-amber-50/40">
        <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>
        <div id="pop-text-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
    </main>

    <div id="start-screen" class="absolute inset-0 bg-slate-900/40 backdrop-blur-md z-40 flex items-center justify-center p-4">
        <div class="bg-white/95 border-4 border-purple-400 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform transition-all relative overflow-hidden">
            <div class="text-5xl mb-2 bounce-anim">🎈</div>
            <h1 class="text-2xl sm:text-3xl font-black text-gray-800 mb-1">繽紛節慶戳氣球</h1>
            <p class="text-xs sm:text-sm text-gray-500 font-bold mb-5">限時 30 秒！戳破氣球奪取最高分！</p>

            <!-- Balloon Types Rules -->
            <div class="grid grid-cols-2 gap-2 text-left text-xs bg-purple-50/60 p-3 rounded-2xl mb-6 border border-purple-100">
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded-full bg-pink-400 flex-shrink-0"></div>
                    <span class="text-gray-700 font-medium">一般氣球 (+10分)</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded-full bg-amber-400 flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-white">★</div>
                    <span class="text-gray-700 font-medium">黃金雙倍 (+50分)</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded-full bg-indigo-500 flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-yellow-300">⭐</div>
                    <span class="text-gray-700 font-medium">星星爆擊 (+100分)</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded-full bg-gradient-to-r from-red-400 via-green-400 to-blue-400 flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-white">🌈</div>
                    <span class="text-gray-700 font-medium">彩虹氣球 (+3 秒)</span>

                <div class="col-span-2 flex items-center gap-2 border-t pt-2 border-purple-200">

            <button id="start-btn" class="w-full bg-gradient-to-r from-purple-500 via-pink-500 to-amber-500 text-white font-black text-lg py-3 px-6 rounded-2xl btn-shadow hover:brightness-110 active:scale-95 transition">

    <div id="end-screen" class="hidden absolute inset-0 bg-slate-900/50 backdrop-blur-md z-40 flex items-center justify-center p-4">
        <div class="bg-white border-4 border-amber-400 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform transition-all relative">
            <div class="text-4xl mb-2" id="rank-emoji">🏆</div>
            <h2 class="text-2xl sm:text-3xl font-black text-gray-800 mb-1">派對結束！</h2>
            <p id="rank-title" class="text-sm font-bold text-purple-600 mb-4">戳氣球大師！</p>

            <!-- Star Rating -->
            <div id="star-rating" class="flex justify-center gap-2 text-3xl mb-4">
                <span class="text-gray-300">★</span>
                <span class="text-gray-300">★</span>
                <span class="text-gray-300">★</span>
            </div>

            <!-- Score Stats -->
            <div class="bg-gray-50 rounded-2xl p-4 mb-6 space-y-2 border border-gray-100">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-500 font-bold">最終得分</span>
                    <span id="final-score" class="party-font text-2xl text-purple-600">0</span>
                </div>
                <div class="flex justify-between items-center text-sm border-t pt-2 border-gray-200">
                    <span class="text-gray-500 font-bold">最高連擊</span>
                    <span id="max-combo" class="party-font text-lg text-amber-500">0x</span>
                </div>
                <div class="flex justify-between items-center text-sm border-t pt-2 border-gray-200">
                    <span class="text-gray-500 font-bold">戳破總數</span>

                </div>
            </div>

            <div class="flex gap-3">
                <button id="restart-btn" class="flex-1 bg-gradient-to-r from-pink-500 to-amber-500 text-white font-black text-lg py-3 px-4 rounded-2xl btn-shadow hover:brightness-110 transition">
                    再玩一次 🔄
                </button>
            </div>
        </div>
    </div>

    <script>
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playPop(pitchModifier = 1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                const baseFreq = (400 + Math.random() * 200) * pitchModifier;
                osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playGoldPop() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.05);
                osc.frequency.setValueAtTime(783.99, now + 0.1);
                osc.frequency.setValueAtTime(1046.50, now + 0.15);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(now + 0.3);
            }

            playStarPop() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1760, now + 0.2);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(now + 0.2);
            }

            playTimePop() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.setValueAtTime(880, now + 0.08);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(now + 0.25);
            }

            playBomb() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.25);

                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(now + 0.25);
            }

            playFanfare() {
                if (!this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.3);
                    }, idx * 90);
                });
            }
        }

        const sound = new SoundEffects();
    </script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const popTextLayer = document.getElementById('pop-text-layer');

        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const timerDisplay = document.getElementById('timer-display');
        const comboContainer = document.getElementById('combo-container');
        const comboCountDisplay = document.getElementById('combo-count');

        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Color Palette for Festive Balloons
        const FESTIVE_COLORS = ['#FF6B6B', '#845EC2', '#FFC75F', '#4D96FF', '#6BCB77', '#FF96AD', '#00C9A7'];

        // Game State
        let isPlaying = false;
        let score = 0;
        let highScore = localStorage.getItem('balloon_pop_highscore') || 0;
        let timeLeft = 30;
        let timerInterval = null;
        let spawnInterval = null;
        let balloons = [];
        let particles = [];
        let confetti = [];
        let combo = 0;
        let maxCombo = 0;
        let lastPopTime = 0;
        let totalPopped = 0;

        highScoreDisplay.textContent = highScore;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Balloon {
            constructor() {
                this.radius = 28 + Math.random() * 16;
                this.x = this.radius + Math.random() * (canvas.width - this.radius * 2);
                this.y = canvas.height + this.radius + 10;
                this.speed = 1.8 + Math.random() * 2.2;
                this.wobbleSpeed = 0.02 + Math.random() * 0.03;
                this.wobbleAmp = 15 + Math.random() * 15;
                this.initialX = this.x;
                this.angle = Math.random() * Math.PI * 2;

                // Types: normal, gold, star, rainbow, bomb
                const rand = Math.random();
                if (rand < 0.08) {
                    this.type = 'bomb';    // 8% Bomb
                    this.color = '#334155';
                } else if (rand < 0.16) {
                    this.type = 'rainbow'; // 8% Rainbow (+3s)
                    this.color = 'rainbow';
                } else if (rand < 0.28) {
                    this.type = 'gold';    // 12% Gold (+50)
                    this.color = '#FFC75F';
                } else if (rand < 0.38) {
                    this.type = 'star';    // 10% Star (+100)
                    this.color = '#6C5CE7';
                } else {
                    this.type = 'normal';  // 62% Normal
                    this.color = FESTIVE_COLORS[Math.floor(Math.random() * FESTIVE_COLORS.length)];
                }
            }

            update() {
                this.y -= this.speed;
                this.angle += this.wobbleSpeed;
                this.x = this.initialX + Math.sin(this.angle) * this.wobbleAmp;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Balloon String
                ctx.beginPath();
                ctx.moveTo(0, this.radius);
                ctx.quadraticCurveTo(5, this.radius + 12, -2, this.radius + 24);
                ctx.strokeStyle = 'rgba(150, 150, 150, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Gradient Body
                let grad;
                if (this.type === 'rainbow') {
                    grad = ctx.createLinearGradient(-this.radius, -this.radius, this.radius, this.radius);
                    grad.addColorStop(0, '#FF6B6B');
                    grad.addColorStop(0.3, '#FFC75F');
                    grad.addColorStop(0.6, '#4D96FF');
                    grad.addColorStop(1, '#845EC2');
                } else if (this.type === 'gold') {
                    grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);
                    grad.addColorStop(0, '#FFF59D');
                    grad.addColorStop(0.5, '#FFC75F');
                    grad.addColorStop(1, '#E67E22');
                } else if (this.type === 'star') {
                    grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);
                    grad.addColorStop(0, '#A29BFE');
                    grad.addColorStop(0.5, '#6C5CE7');
                    grad.addColorStop(1, '#3C40C6');
                } else if (this.type === 'bomb') {
                    grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);
                    grad.addColorStop(0, '#64748B');
                    grad.addColorStop(0.7, '#1E293B');
                    grad.addColorStop(1, '#0F172A');
                } else {
                    grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);
                    grad.addColorStop(0, '#FFFFFF');
                    grad.addColorStop(0.3, this.color);
                    grad.addColorStop(1, adjustColor(this.color, -40));
                }

                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 0.85, this.radius, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // Knot
                ctx.beginPath();
                ctx.moveTo(-4, this.radius);
                ctx.lineTo(4, this.radius);
                ctx.lineTo(6, this.radius + 5);
                ctx.lineTo(-6, this.radius + 5);
                ctx.closePath();
                ctx.fillStyle = this.type === 'rainbow' ? '#FF6B6B' : this.color;
                ctx.fill();

                // Highlight Shine
                ctx.beginPath();
                ctx.ellipse(-this.radius * 0.35, -this.radius * 0.4, this.radius * 0.25, this.radius * 0.12, Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();

                // Special Icons
                if (this.type === 'gold') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = `bold ${this.radius * 0.9}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', 0, 0);
                } else if (this.type === 'star') {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = `bold ${this.radius * 0.95}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⭐', 0, 0);
                } else if (this.type === 'rainbow') {
                    ctx.font = `${this.radius * 0.85}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🌈', 0, 0);
                } else if (this.type === 'bomb') {
                    ctx.font = `${this.radius * 0.9}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💣', 0, 0);
                }

                ctx.restore();
            }
        }

        // Particle System for popping effects
        class Particle {
            constructor(x, y, color, isStar = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.isStar = isStar;
                this.radius = isStar ? 4 + Math.random() * 4 : 3 + Math.random() * 4;
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.15;
                this.alpha = 1;
                this.decay = 0.02 + Math.random() * 0.02;
                this.rotation = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
                this.rotation += 0.1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                if (this.isStar) {
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = '#FFD700';
                    ctx.font = `${this.radius * 3}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', 0, 0);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class ConfettiParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = 6 + Math.random() * 8;
                this.color = FESTIVE_COLORS[Math.floor(Math.random() * FESTIVE_COLORS.length)];
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = 2 + Math.random() * 4;
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 10;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function adjustColor(col, amt) {
            let usePound = false;
            if (col[0] == "#") {
                col = col.slice(1);
                usePound = true;
            }
            let num = parseInt(col, 16);
            let r = (num >> 16) + amt;
            if (r > 255) r = 255; else if (r < 0) r = 0;
            let b = ((num >> 8) & 0x00FF) + amt;
            if (b > 255) b = 255; else if (b < 0) b = 0;
            let g = (num & 0x0000FF) + amt;
            if (g > 255) g = 255; else if (g < 0) g = 0;
            return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16);
        }

        function createPopParticles(x, y, color, count = 15, isStar = false) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, isStar));
            }
        }

        function showFloatingText(text, x, y, color = '#845EC2') {
            const el = document.createElement('div');
            el.className = 'pop-text absolute party-font font-black text-2xl select-none';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            el.style.textShadow = '0 2px 4px rgba(0,0,0,0.2)';
            el.textContent = text;
            popTextLayer.appendChild(el);

            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 800);
        }

        function handlePop(clientX, clientY) {
            if (!isPlaying) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            let hitIndex = -1;

            for (let i = balloons.length - 1; i >= 0; i--) {
                const b = balloons[i];
                const dist = Math.hypot(b.x - clickX, b.y - clickY);
                if (dist < b.radius + 10) {
                    hitIndex = i;
                    break;
                }
            }

            if (hitIndex !== -1) {
                const b = balloons[hitIndex];
                balloons.splice(hitIndex, 1);
                totalPopped++;

                // Combo System
                const now = Date.now();
                if (now - lastPopTime < 600) {
                    combo++;
                } else {
                    combo = 1;
                }
                lastPopTime = now;
                if (combo > maxCombo) maxCombo = combo;

                if (combo > 1) {
                    comboContainer.classList.remove('opacity-0');
                    comboCountDisplay.textContent = `${combo}x`;
                }

                const multiplier = combo > 1 ? Math.min(combo, 5) : 1;

                if (b.type === 'bomb') {
                    sound.playBomb();
                    createPopParticles(b.x, b.y, '#1E293B', 25);
                    const penalty = 30;
                    score = Math.max(0, score - penalty);
                    showFloatingText(`-${penalty}`, b.x, b.y, '#FF6B6B');
                    combo = 0;
                    comboContainer.classList.add('opacity-0');
                } else if (b.type === 'gold') {
                    sound.playGoldPop();
                    createPopParticles(b.x, b.y, '#FFC75F', 25);
                    const pts = 50 * multiplier;
                    score += pts;
                    showFloatingText(`+${pts} ★`, b.x, b.y, '#FFC75F');
                } else if (b.type === 'star') {
                    sound.playStarPop();
                    createPopParticles(b.x, b.y, '#6C5CE7', 25, true);
                    const pts = 100 * multiplier;
                    score += pts;
                    showFloatingText(`+${pts} ⭐`, b.x, b.y, '#A29BFE');
                } else if (b.type === 'rainbow') {
                    sound.playTimePop();
                    createPopParticles(b.x, b.y, '#4D96FF', 20);
                    timeLeft += 3;
                    timerDisplay.textContent = timeLeft;
                    showFloatingText(`+3 秒 🌈`, b.x, b.y, '#4D96FF');
                } else {
                    sound.playPop(1.0 + Math.min(combo * 0.1, 0.8));
                    createPopParticles(b.x, b.y, b.color, 12);
                    const pts = 10 * multiplier;
                    score += pts;
                    showFloatingText(`+${pts}`, b.x, b.y, b.color);
                }

                scoreDisplay.textContent = score;
            }
        }

        canvas.addEventListener('mousedown', (e) => handlePop(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                handlePop(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        function spawnBalloons() {
            if (!isPlaying) return;
            if (balloons.length < 18) {
                balloons.push(new Balloon());
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = balloons.length - 1; i >= 0; i--) {
                const b = balloons[i];
                b.update();
                b.draw();

                if (b.y < -b.radius * 2) {
                    balloons.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.update();
                c.draw();
                if (c.y > canvas.height + 20) confetti.splice(i, 1);
            }

            if (Date.now() - lastPopTime > 1200 && combo > 0) {
                combo = 0;
                comboContainer.classList.add('opacity-0');
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            sound.init();
            isPlaying = true;
            score = 0;
            timeLeft = 30;
            combo = 0;
            maxCombo = 0;
            totalPopped = 0;
            balloons = [];
            particles = [];
            confetti = [];

            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;

            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');

            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    if (isPlaying) balloons.push(new Balloon());
                }, i * 150);
            }

            clearInterval(timerInterval);
            clearInterval(spawnInterval);

            spawnInterval = setInterval(spawnBalloons, 600);

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            clearInterval(spawnInterval);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('balloon_pop_highscore', highScore);
                highScoreDisplay.textContent = highScore;
            }

            const rankEmoji = document.getElementById('rank-emoji');
            const rankTitle = document.getElementById('rank-title');
            const starContainer = document.getElementById('star-rating');
            
            let stars = 1;
            let rank = "派對新手 🎈";
            let emoji = "🎈";

            if (score >= 600) {
                stars = 3;
                rank = "派對大玩家 🌟";
                emoji = "👑";
            } else if (score >= 300) {
                stars = 2;
                rank = "戳氣球達人 🎯";
                emoji = "🏆";
            }

            rankEmoji.textContent = emoji;
            rankTitle.textContent = rank;

            starContainer.innerHTML = Array(3).fill(0).map((_, i) => 
                `<span class="${i < stars ? 'text-amber-400' : 'text-gray-300'}">★</span>`
            ).join('');

            document.getElementById('final-score').textContent = score;
            document.getElementById('max-combo').textContent = `${maxCombo}x`;
            document.getElementById('total-popped').textContent = totalPopped;

            endScreen.classList.remove('hidden');

            for (let i = 0; i < 80; i++) {
                confetti.push(new ConfettiParticle());
            }
            sound.playFanfare();
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
